<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      background: #ddd;
      padding: 20px;
      border-radius: 999px;
    }

    .container div {
      flex: 0 1 50px;
      /* grow shrink basis*/
      padding: 30px;
      background: pink;
      border-radius:15px;
    }
  </style>

</head>

<body>

  <div class="container">
    <div>15</div>
    <div>30</div>
    <div>04</div>
    <div>10</div>
  </div>

</body>

</html>
